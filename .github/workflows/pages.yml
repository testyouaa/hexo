name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main # 确保你的主分支叫 main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 关键步骤：修改配置，适配 GitHub 的 /hexo/ 子目录
      # 这样就不用去动你本地的 _config.yml，完美兼容 Cloudflare
      - name: Modify Hexo Config for GitHub Pages
        run: |
          sed -i 's|root: /|root: /hexo/|g' _config.yml
          sed -i 's|url: .*|url: https://${{ github.repository_owner }}.github.io/hexo|g' _config.yml

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npx hexo clean && npx hexo generate

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public