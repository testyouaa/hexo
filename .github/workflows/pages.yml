name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 官方规定的权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 👇 粘贴从这里开始 👇
      - name: Modify Hexo Config for GitHub Pages
        run: |
          sed -i 's|root: .*|root: /hexo/|g' _config.yml
          sed -i 's|url: .*|url: https://${{ github.repository_owner }}.github.io/hexo|g' _config.yml
      # 👆 粘贴到这里结束 👆

      - name: Install and Build
        run: |
          npm install
          npx hexo clean
          npx hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
